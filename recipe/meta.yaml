{% set name = "rlp" %}
{% set version = "5.0.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ae8ac791160c160e270f9c7df76e68f4d42bb86a13726d807b9357c312d0bac4

build:
  number: 0
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - setuptools
    - pip
    - python {{ python_min }}
    - setuptools-markdown
    - setuptools-scm
  run:
    - eth-utils >=2.0.0
    - python >={{ python_min }}

test:
  imports:
    - rlp
    - rlp.sedes
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/ethereum/pyrlp
  summary: A package for Recursive Length Prefix encoding and decoding
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - step21
